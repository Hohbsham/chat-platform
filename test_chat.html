<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Chat Test</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:20px auto;background:#111;color:#eee}
input{padding:10px;width:70%;background:#222;color:#fff;border:1px solid #444}
button{padding:10px 20px;background:#444;color:#fff;border:none;cursor:pointer}
#log{border:1px solid #333;padding:10px;height:400px;overflow-y:auto;margin:10px 0;background:#1a1a1a}
.msg{margin:4px 0;padding:4px 8px;border-radius:4px}
.user{background:#224;text-align:right}
.hermes{background:#242;text-align:left}
</style></head><body>
<h2>A2A Chat Test</h2>
<div id="log"></div>
<input id="msg" placeholder="Type Hermes..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>

<script>
let lastTs = Date.now()/1000 - 300;

function send(){
    const content = document.getElementById('msg').value.trim();
    if(!content) return;
    document.getElementById('msg').value = '';

    fetch('/api/send', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({sender:'User',content})
    }).then(r=>r.json()).then(d=>{
        logMsg(`Sent: ${content} (ok=${d.ok})`);
        poll();
    }).catch(e=>logMsg('ERROR: '+e));
}

function poll(){
    fetch('/api/messages?since='+lastTs)
    .then(r=>r.json()).then(data=>{
        const msgs = Array.isArray(data) ? data : data.messages || [];
        for(const m of msgs){
            if(!m) continue;
            logMsg(m.content, m.sender==='Hermes'?'hermes':'user');
            lastTs = Math.max(lastTs, m.ts||0);
        }
    }).catch(e=>console.error(e));
}

function logMsg(text, cls='user'){
    const d = document.createElement('div');
    d.className = 'msg '+cls;
    d.textContent = (cls==='hermes'?'Hermes: ':'') + text;
    document.getElementById('log').appendChild(d);
    document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
}

setInterval(poll, 2000);
poll();
logMsg('Test page ready. Type Hermes and press Enter.');
</script>
</body></html>
